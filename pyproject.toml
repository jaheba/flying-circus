[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flying-circus"
version = "0.1.0"
description = "Black-box application benchmarks for Monty"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["protobuf>=6.31.1,<7"]

[project.scripts]
flying-circus = "flying_circus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flying_circus"]
