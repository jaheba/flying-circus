name: Benchmarks and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      python_version:
        description: CPython version
        default: '3.14'
        type: string
      pypy_version:
        description: PyPy interpreter version
        default: pypy3.11
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  benchmark:
    permissions:
      contents: read
      actions: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Set up CPython
        id: cpython
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version || '3.14' }}
      - name: Set up PyPy
        id: pypy
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.pypy_version || 'pypy3.11' }}
      - name: Install harness and run tests
        run: |
          uv sync --locked --python '${{ steps.cpython.outputs.python-path }}'
          uv run --no-sync python -m unittest discover -s tests
      - name: Install latest published Monty
        run: |
          uv run --no-sync python scripts/install_monty.py \
            --python '${{ steps.cpython.outputs.python-path }}' --output _runtimes
      - name: Restore previous published history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          previous_run=$(gh run list --workflow benchmarks.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --name benchmark-history --dir _site
          fi
      - name: Compare all runtimes
        id: benchmarks
        continue-on-error: true
        run: |
          uv run --no-sync flying-circus \
            -r monty="$PWD/_runtimes/monty/bin/monty" \
            -r cpython='${{ steps.cpython.outputs.python-path }}' \
            -r pypy='${{ steps.pypy.outputs.python-path }}' \
            --samples 20 --memory-samples 3 --startup-samples 50 --warmups 3 --timeout 120 \
            --format html --format markdown --format json --output results/current
      - name: Build Pages site
        env:
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HARNESS_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          uv run --no-sync python scripts/publish_results.py results/current _site \
            --run-id "$(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }}-${{ github.run_attempt }}" \
            --monty-packages _runtimes
      - name: Save reports and history
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: _site
          retention-days: 90
          if-no-files-found: error
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Flag measurement failures
        if: steps.benchmarks.outcome == 'failure'
        run: |
          echo 'Benchmark failures are visible in the report; inspect the results.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: benchmark
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy benchmark results
        id: deployment
        uses: actions/deploy-pages@v4
